<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>WealthQ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;450;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="wealthq-chat.css"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
</head>
<body>

<!-- HEADER — Full viewport width, outside shell -->
<header class="app-header" id="main-header">
  <div class="logo-mark">W</div>
  <div class="hdr-brand"><h1>Wealth<span>Q</span></h1></div>
  <div id="header-center"></div>
  <div class="hdr-right" id="header-right">
    <div class="lang-toggle">
      <button class="lang-btn active" data-lang="english" onclick="switchLang('english')">EN</button>
      <button class="lang-btn" data-lang="hindi" onclick="switchLang('hindi')">HI</button>
      <button class="lang-btn" data-lang="hinglish" onclick="switchLang('hinglish')">MIX</button>
    </div>
    <div class="status-dot"><div class="dot"></div><span>Online</span></div>
  </div>
</header>

<div class="shell">

  <!-- ===== DASHBOARD VIEW ===== -->
  <div id="dashboard-view">
    <div class="dash-hero">
      <h2 id="dash-title">What do you need help with?</h2>
      <p id="dash-desc">Pick a category to continue where you left off, or start fresh.</p>
    </div>

    <div class="cat-grid" id="cat-grid"></div>

    <button class="other-chat" id="other-chat-btn" onclick="openFreeChat()">
      I want to talk about something else
    </button>
  </div>

  <!-- ===== CHAT VIEW ===== -->
  <div id="chat-view" class="hidden">
    <div class="chat-body">
      <!-- Main chat column -->
      <div class="chat-main">
        <div id="chat"></div>

        <div class="input-area">
          <div id="file-preview" class="file-preview hidden">
            <div class="file-chip">
              <span id="file-chip-icon"></span>
              <span id="file-chip-name"></span>
              <button class="file-remove" onclick="removeFile()">x</button>
            </div>
          </div>
          <div class="input-row">
            <button class="attach-btn" onclick="document.getElementById('file-input').click()" title="Attach file">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
            </button>
            <input type="file" id="file-input" accept=".pdf,.csv,image/*" style="display:none" onchange="handleFileSelect(event)"/>
            <textarea id="user-input" placeholder="Type here..." rows="1" onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
            <button class="mic-btn" id="mic-btn" onclick="toggleMic()" title="Speak">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="11" rx="3"/><path d="M19 10a7 7 0 0 1-14 0"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="8" y1="22" x2="16" y2="22"/></svg>
            </button>
            <button class="send-btn" id="send-btn" onclick="sendMessage()" title="Send">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
            </button>
          </div>
          <div class="input-hint" id="input-hint">PDF / CSV / Photos &mdash; not financial advice</div>
        </div>
      </div>

      <!-- Sidebar: sticky visual cards -->
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <span class="sidebar-title">Insights</span>
          <button class="sidebar-close" onclick="closeSidebar()" title="Close">&times;</button>
        </div>
        <div class="sidebar-cards" id="sidebar-cards"></div>
      </aside>
    </div>
  </div>

</div>

<div id="toast"></div>

<script src="wealthq-chat.js"></script>
</body>
</html>
